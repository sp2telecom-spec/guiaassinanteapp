<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GUIA TV + APP SP2TV</title>

<style>
html, body {
  width: 100%;
  height: 1080px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent; 
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #fff;
}

/* ==========================================
   WIDGET DE CLIMA E RELÓGIO
   ========================================== */
.widget-moderno {
  position: fixed;
  top: 30px;
  right: 40px;
  width: 420px; 
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 10px;
  background: transparent;
  z-index: 10000;
}

.widget-moderno .header-relogio {
  display: flex;
  flex-direction: column; 
  align-items: flex-end;
  border-bottom: 2px solid rgba(255, 255, 255, 0.3);
  padding-bottom: 12px;
  margin-bottom: 8px;
}

.widget-moderno .hora {
  font-size: 72px; 
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
  color: #ffffff;
  text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.8);
}

.widget-moderno .data {
  font-size: 22px; 
  font-weight: 600;
  margin-top: 5px;
  text-transform: capitalize;
  color: #ffffff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}

.widget-moderno .lista-cidades {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.widget-moderno .item-cidade {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: transparent;
  padding: 8px 10px;
}

.widget-moderno .cidade-nome {
  font-size: 20px; 
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8);
}

.widget-moderno .clima-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.widget-moderno .temp {
  font-size: 26px; 
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8);
}

.widget-moderno img {
  width: 36px; 
  height: 36px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
}

/* ==========================================
   CAROUSEL E LAYOUT
   ========================================== */
.carousel-container {
  width: 100%;
  position: fixed;
  bottom: 35px;
  left: 0;
  padding: 25px 0 10px 0;
  z-index: 9999;
}

.carousel-wrapper {
  overflow: hidden;
  width: calc(100% - 80px); 
  margin: 0 auto;
}

.carousel-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 170px); 
  gap: 20px; 
}

.channel {
  height: 170px;
  background: rgba(18, 18, 18, 0.85); 
  backdrop-filter: blur(15px);
  border-radius: 18px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center; 
  gap: 18px;                
  box-sizing: border-box;
}

.logo-container {
  width: 110px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0; 
}

.logo {
  max-width: 100%;
  max-height: 110px;
  object-fit: contain;
}

.channel-info {
  flex-grow: 1;
  min-width: 0; 
}

.title {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 5px;
  color: #fff;
}

.program {
  font-size: 16px;
  line-height: 1.3;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2; 
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.next {
  font-size: 14px;
  opacity: .8;
  color: #ccc;
}

.progress {
  height: 6px;
  background: rgba(255, 255, 255, 0.15);
  margin: 10px 0;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #00c853; 
}

/* CARD DE NOTÍCIAS */
.news-full-card {
  grid-column: span 3;
  grid-row: span 2;
  height: 360px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(15px);
  border: 2px solid #00c853;
  border-radius: 20px;
  padding: 30px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.news-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  padding-bottom: 10px;
}

.news-badge {
  background: #00c853;
  color: #000;
  padding: 6px 14px;
  font-weight: 800;
  border-radius: 8px;
  font-size: 16px;
  text-transform: uppercase;
}

.news-source {
  font-size: 16px;
  color: #a0aec0;
  font-weight: bold;
}

.news-title {
  font-size: 30px;
  font-weight: 700;
  line-height: 1.3;
  color: #fff;
  margin: 15px 0 10px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-resumo {
  font-size: 18px;
  color: #cbd5e1;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-footer {
  font-size: 14px;
  color: #718096;
  text-align: right;
}

/* ==========================================
   RODAPÉ INFORMATIVO
   ========================================== */
.rodape-informativo {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 30px;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10001;
}

.rodape-texto {
  font-size: 14px;
  color: #cccccc;
  font-weight: 500;
  letter-spacing: 0.3px;
  text-align: center;
}
</style>
</head>

function processarIconeClima(code) {
  let imgUrl = "https://cdn-icons-png.flaticon.com/512/869/869869.png"; 
  if(code === 1 || code === 2) imgUrl = "https://cdn-icons-png.flaticon.com/512/1163/1163736.png"; 
  if(code === 3) imgUrl = "https://cdn-icons-png.flaticon.com/512/252/252035.png"; 
  if(code >= 51 && code <= 67) imgUrl = "https://cdn-icons-png.flaticon.com/512/3351/3351979.png"; 
  if(code >= 80) imgUrl = "https://cdn-icons-png.flaticon.com/512/1779/1779927.png";
  return imgUrl;
}

function atualizarDadosDeTodasCidades() {
  CIDADES_CLIMA.forEach((cidade, index) => {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cidade.lat}&longitude=${cidade.lon}&current_weather=true`)
      .then(r => r.json()).then(dados => {
        if(dados && dados.current_weather) {
          CIDADES_CLIMA[index].temp = `${Math.round(dados.current_weather.temperature)}°C`;
          CIDADES_CLIMA[index].icone = processarIconeClima(dados.current_weather.weathercode);
        }
      }).catch(() => {});
  });
}

function rotacionarCidadesWidget() {
  const container = document.getElementById("container-clima");
  if(!container) return;
  const inicio = paginaClimaAtual * cidadesPorSlide;
  const listaExibicao = CIDADES_CLIMA.slice(inicio, inicio + cidadesPorSlide);
  let html = "";
  listaExibicao.forEach(c => {
    html += `<div class="item-cidade"><div class="cidade-nome">${c.nome}</div><div class="clima-info">${c.icone ? `<img src="${c.icone}">` : ''}<div class="temp">${c.temp}</div></div></div>`;
  });
  container.innerHTML = html;
  paginaClimaAtual = (paginaClimaAtual + 1) % (CIDADES_CLIMA.length / cidadesPorSlide);
}

function limparTexto(str) {
  if (!str) return "";
  const temp = document.createElement("div");
  temp.innerHTML = str;
  return (temp.textContent || temp.innerText || "").trim();
}

async function buscarNoticiasRSS() {
  const fontes = [
    { nome: "G1 Campinas e Região", url: "https://g1.globo.com/rss/g1/sp/campinas-regiao/" },
    { nome: "G1 São Carlos e Região", url: "https://g1.globo.com/rss/g1/sp/sao-carlos-regiao/" }
  ];

  let listaAcumulada = [];

  for (const fonte of fontes) {
    try {
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(fonte.url)}`);
      if (res.ok) {
        const dados = await res.json();
        if (dados && dados.status === 'ok' && dados.items && dados.items.length > 0) {
          dados.items.slice(0, 3).forEach(item => {
            if (item.title) {
              listaAcumulada.push({
                titulo: limparTexto(item.title),
                resumo: limparTexto(item.description || item.content),
                fonte: fonte.nome
              });
            }
          });
        }
      }
    } catch (e) {}
  }

  if (listaAcumulada.length > 0) {
    cacheNoticias = listaAcumulada;
  }
}

buscarNoticiasRSS();
setInterval(buscarNoticiasRSS, 300000);

function parseDate(t, ajusteHoras = 0) {
  if (!t) return 0;
  try {
    const partes = t.replace(/\s+/g, ' ').trim().split(' ');
    const limpo = partes[0];
    let fuso = partes[1] || "+0000";
    const utcMs = Date.UTC(parseInt(limpo.substring(0, 4)), parseInt(limpo.substring(4, 6)) - 1, parseInt(limpo.substring(6, 8)), parseInt(limpo.substring(8, 10)), parseInt(limpo.substring(10, 12)), limpo.length >= 14 ? parseInt(limpo.substring(12, 14)) : 0);
    const sinal = fuso.charAt(0) === '-' ? -1 : 1;
    const offset = ((parseInt(fuso.substring(1, 3)) * 60) + parseInt(fuso.substring(3, 5))) * 60 * 1000;
    return utcMs - (sinal * offset) + (ajusteHoras * 3600000);
  } catch(e) { return 0; }
}

/* ==========================================
   RENDERIZAÇÃO DOS SLIDES DO CARROSSEL
   ========================================== */
function renderizarSlide() {
  const box = document.getElementById("carousel");
  if (!box) return;

  // SE FOR O MOMENTO DE MOSTRAR NOTÍCIA
  if (exibindoNoticia) {
    const noticia = cacheNoticias[indexNoticiaAtual % cacheNoticias.length];
    box.innerHTML = `
      <div class="news-full-card">
        <div class="news-header">
          <span class="news-badge">Destaques da Região</span>
          <span class="news-source">${noticia.fonte}</span>
        </div>
        <div>
          <div class="news-title">${noticia.titulo}</div>
          <div class="news-resumo">${noticia.resumo || ''}</div>
        </div>
        <div class="news-footer">Região de Cobertura Integrada • Notícias da Região</div>
      </div>
    `;
    indexNoticiaAtual = (indexNoticiaAtual + 1) % cacheNoticias.length;
    return;
  }

  // EXIBIÇÃO DAS PÁGINAS DE CANAIS
  const now = Date.now();
  const canaisDaPagina = canais.slice(paginaAtual * itensPorPagina, (paginaAtual * itensPorPagina) + itensPorPagina);
  let html = "";
  
  canaisDaPagina.forEach(c => {
    const progs = cacheProgramas.filter(p => (Array.isArray(c.id) ? c.id : [c.id]).includes(p.channel)).sort((a, b) => a.start - b.start);
    const atual = progs.find(p => p.start <= now && p.stop > now);
    const prox = progs.find(p => p.start >= (atual ? atual.stop : now));
    const prog = atual ? Math.max(0, Math.min(100, ((now - atual.start) / (atual.stop - atual.start)) * 100)) : 0;
    const simb = atual?.origem === 1 ? "." : atual?.origem === 2 ? ".." : atual?.origem === 3 ? "..." : "";
    html += `<div class="channel"><div class="logo-container">${c.logo ? `<img class="logo" src="${c.logo}">` : ''}</div><div class="channel-info"><div class="title">${c.nome}</div><div class="program"><b>${atual ? new Date(atual.start).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "--:--"}</b> - ${atual?.title || "Sem programação"}</div><div class="progress"><div class="bar" style="width:${prog}%"></div></div><div class="next">➡ ${prox ? new Date(prox.start).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "--:--"} - ${prox?.title || "Sem info"} <b>${simb}</b></div></div></div>`;
  });
  box.innerHTML = html;
}

function atualizar(){
  const agora = Date.now();
  const ids = canais.flatMap(c => c.id);
  Promise.all(EPG_URLS.map(f => fetch(f.url).then(r => r.text()).then(str => {
    const xml = new DOMParser().parseFromString(str, "text/xml");
    return Array.from(xml.querySelectorAll("programme")).filter(p => ids.includes(p.getAttribute("channel"))).map(p => ({ channel: p.getAttribute("channel"), start: parseDate(p.getAttribute("start"), f.ajusteHoras), stop: parseDate(p.getAttribute("stop"), f.ajusteHoras), title: p.querySelector("title")?.textContent || "Sem título", origem: f.idFonte })).filter(p => p.stop > agora);
  }).catch(() => []))).then(res => { cacheProgramas = res.flat(); renderizarSlide(); }).catch(() => renderizarSlide());
}

// RENDERIZAÇÃO INICIAL IMEDIATA
renderizarSlide();
atualizar();
setInterval(atualizar, 60000); 

// TEMPORIZADOR DE TRANSIÇÃO (A CADA 15 SEGUNDOS)
setInterval(() => {
  if (exibindoNoticia) {
    exibindoNoticia = false;
    contadorPaginasCanais = 0;
  } else {
    paginaAtual = (paginaAtual + 1) % totalPaginasCanais; 
    contadorPaginasCanais++;

    if (contadorPaginasCanais >= 10) {
      exibindoNoticia = true;
    }
  }
  
  renderizarSlide();
}, 15000);
</script>
